---
- hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create bucket
      shell: |
        aws \
        --endpoint-url=http://host.docker.internal:4566 \
        --region us-east-1 \
        s3 mb s3://simon-bucket
      register: result
    - debug:
        var: result.stdout_lines